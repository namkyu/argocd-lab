# Deployment가 만든 파드들 앞에 안정적인 접근점을 제공하는 Service.
# argocd-lab-app 라벨을 가진 파드로 트래픽을 분산 전달한다.
apiVersion: v1
kind: Service
metadata:
  name: argocd-lab-app
spec:
  selector:
    app: argocd-lab-app        # 이 라벨을 가진 파드로 트래픽 전달
  ports:
    - port: 80                 # 서비스 자체 포트
      targetPort: 80           # 파드(컨테이너) 쪽 포트
  # 클러스터 내부에서만 접근 가능. 외부 확인은
  # kubectl port-forward svc/argocd-lab-app <local-port>:80 으로 함
  type: ClusterIP
