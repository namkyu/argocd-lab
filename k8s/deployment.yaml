# ArgoCD가 감시하는 경로(k8s/)에 포함된 매니페스트.
# 이 파일의 내용이 GitHub master 브랜치에서 바뀌면 ArgoCD가 감지해서
# 여기 적힌 상태(replica 수, 이미지 태그 등)로 클러스터를 맞춘다(sync).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-lab-app
  labels:
    app: argocd-lab-app
spec:
  replicas: 2 # 동시에 띄울 파드 개수
  selector:
    matchLabels:
      app: argocd-lab-app
  template:
    metadata:
      labels:
        app: argocd-lab-app
    spec:
      containers:
        - name: app
          # GitHub Actions(.github/workflows/build-and-bump.yml)가 app/ 변경을
          # 감지해서 이미지를 빌드/푸시하고, 이 줄의 태그를 자동으로 갱신해 커밋한다.
          # 사람이 직접 태그를 바꿀 필요 없음 - init은 워크플로 최초 실행 전 placeholder.
          image: ghcr.io/namkyu/argocd-lab-app:87336c1
          # 커밋마다 고유한 태그(git short SHA)를 쓰므로 캐시 문제 없이 IfNotPresent로 충분
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
